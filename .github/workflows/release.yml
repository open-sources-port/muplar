name: Build Muplar release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/name, for example v0.1.0-dev"
        required: true
        default: "v0.1.0-dev"
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    # macos-15 is Apple Silicon on current GitHub-hosted runner images.
    # For the full Wine/DXMT build, a self-hosted Apple Silicon runner with
    # Rosetta + x86_64 Homebrew is more reliable and usually much faster.
    runs-on: macos-15
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      ANDROID_NDK_HOME: /opt/homebrew/share/android-ndk

      # Native Apple Silicon Homebrew.
      HOMEBREW_ARM_PREFIX: /opt/homebrew

      # Intel Homebrew under Rosetta, used only for Wine/DXMT x86_64 tooling.
      HOMEBREW_X86_PREFIX: /usr/local

      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Make SSH-style submodule URLs work without SSH keys
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config meson rust \
            bison flex freetype libpng zlib bzip2 sdl2 gnutls \
            pixman libxkbcommon openssl@3 lz4 zstd gnutls llvm

          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"

          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"

          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          which llvm-objcopy
          llvm-objcopy --version

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          brew install --cask android-ndk
          test -d /opt/homebrew/share/android-ndk
          test -x /opt/homebrew/bin/ndk-build
          echo "ANDROID_NDK_HOME=/opt/homebrew/share/android-ndk" >> "$GITHUB_ENV"

      - name: Install binutils
        shell: bash
        run: |
          set -euxo pipefail
          brew install aarch64-elf-binutils
          brew --prefix aarch64-elf-binutils
          ls -la /opt/homebrew/opt/aarch64-elf-binutils/bin
      - name: Install GNU binutils
        run: |
          brew install binutils
          echo "$(brew --prefix binutils)/bin" >> "$GITHUB_PATH"

      - name: Verify bundled binary prerequisites
        run: |
          test -d third_party/angle-bin || { echo "ERROR: third_party/angle-bin missing. Commit/download ANGLE libEGL.dylib and libGLESv2.dylib before release."; exit 1; }
          test -d third_party/angle-include || { echo "ERROR: third_party/angle-include missing. Commit/download ANGLE headers before release."; exit 1; }

      - name: Install Rosetta for x86_64 Windows compatibility build
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true

      - name: Prepare x86_64 Homebrew under Rosetta
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x "${HOMEBREW_X86_PREFIX}/bin/brew" ]; then
            echo "Installing x86_64 Homebrew into ${HOMEBREW_X86_PREFIX}"

            sudo mkdir -p "${HOMEBREW_X86_PREFIX}"
            sudo chown -R "$(whoami)":admin "${HOMEBREW_X86_PREFIX}"

            curl -fsSL \
              https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh \
              -o /tmp/install-homebrew-x86.sh

            NONINTERACTIVE=1 arch -x86_64 /bin/bash /tmp/install-homebrew-x86.sh
          fi

          arch -x86_64 "${HOMEBREW_X86_PREFIX}/bin/brew" --prefix
          arch -x86_64 "${HOMEBREW_X86_PREFIX}/bin/brew" --version

      - name: Install x86_64 Homebrew dependencies for Wine and DXMT
        shell: bash
        env:
          HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail

          X86_BREW="${HOMEBREW_X86_PREFIX}/bin/brew"

          sudo mkdir -p \
            /usr/local/Homebrew \
            /usr/local/bin \
            /usr/local/etc \
            /usr/local/include \
            /usr/local/lib \
            /usr/local/opt \
            /usr/local/sbin \
            /usr/local/share/zsh/site-functions \
            /usr/local/var

          sudo chown -R "$(whoami)":admin \
            /usr/local/Homebrew \
            /usr/local/bin \
            /usr/local/etc \
            /usr/local/include \
            /usr/local/lib \
            /usr/local/opt \
            /usr/local/sbin \
            /usr/local/share \
            /usr/local/var 2>/dev/null || true

          chmod -R u+rwX /usr/local/share/zsh || true

          # GitHub runner may already have Python.framework symlinks in /usr/local/bin.
          # They block x86_64 Homebrew python@3.14 link.
          for f in \
            idle3 idle3.14 \
            pip3 pip3.14 \
            pydoc3 pydoc3.14 \
            python3 python3-config \
            python3.14 python3.14-config
          do
            if [ -L "/usr/local/bin/$f" ]; then
              target="$(readlink "/usr/local/bin/$f" || true)"
              if echo "$target" | grep -q "/Library/Frameworks/Python.framework/Versions/3.14"; then
                echo "Removing conflicting Python.framework symlink: /usr/local/bin/$f -> $target"
                rm -f "/usr/local/bin/$f"
              fi
            fi
          done

          set +e
          arch -x86_64 "$X86_BREW" install bison \
            flex pkg-config \
            mingw-w64 freetype \
            gettext \
            gnutls \
            zlib \
            bzip2 \
            libpng \
            sdl2 \
            meson \
            llvm llvm@15 \
            vulkan-headers \
            vulkan-loader \
            molten-vk \
            vulkan-tools
          BREW_STATUS=$?
          set -e

          if [ "$BREW_STATUS" -ne 0 ]; then
            echo "x86_64 brew install failed with status ${BREW_STATUS}."
            echo "Trying known python@3.14 link fix, then retrying."

            if arch -x86_64 "$X86_BREW" list python@3.14 >/dev/null 2>&1; then
              arch -x86_64 "$X86_BREW" link --overwrite --force python@3.14 || true
            fi

            arch -x86_64 "$X86_BREW" install \
              bison flex pkg-config mingw-w64 \
              freetype gettext gnutls zlib \
              bzip2 libpng sdl2 \
              meson \
              llvm llvm@15 \
              vulkan-headers \
              vulkan-loader \
              molten-vk \
              vulkan-tools
          fi

          arch -x86_64 "$X86_BREW" link --overwrite --force python@3.14 || true

          arch -x86_64 "$X86_BREW" --prefix
          arch -x86_64 "$X86_BREW" list --versions \
            bison flex pkg-config mingw-w64 freetype gnutls zlib bzip2 \
            libpng sdl2 meson llvm vulkan-loader molten-vk vulkan-tools

      - name: Download prebuilt Wine runtime
        env:
          GH_TOKEN: ${{ github.token }}
          WINE_RUNTIME_VERSION: ${{ github.event.inputs.wine_runtime_version || '001' }}
          WINE_RUNTIME_PREFIX: ${{ github.event.inputs.wine_runtime_prefix || 'wine-runtime-' }}
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE:-$(pwd)}"
          mkdir -p .wine-runtime build

          gh release download ${WINE_RUNTIME_PREFIX}${WINE_RUNTIME_VERSION} \
            --pattern "muplar-wine-runtime-macos-arm64-x86_64.tar.gz" \
            --dir .wine-runtime \
            --clobber

          tar -xzf .wine-runtime/muplar-wine-runtime-macos-arm64-x86_64.tar.gz \
            -C ${ROOT_DIR}/build

          test -x ${ROOT_DIR}/build/wine-prefix/bin/wine || {
            echo "ERROR: prebuilt Wine runtime was not restored."
            exit 1
          }

          test -f ${ROOT_DIR}/build/wine-prefix/lib/wine/x86_64-unix/winemetal.so || {
            echo "ERROR: prebuilt DXMT runtime was not restored."
            exit 1
          }

      - name: Download prebuilt JDK runtime
        env:
          GH_TOKEN: ${{ github.token }}
          JDK_RUNTIME_VERSION: ${{ github.event.inputs.jdk_runtime_version || '001' }}
          JDK_RUNTIME_PREFIX: ${{ github.event.inputs.jdk_runtime_prefix || 'jdk-runtime' }}
          JDK_VERSION: ${{ github.event.inputs.jdk_version || '21' }}
        run: |
          set -euo pipefail
          umask 022
          ROOT_DIR="${GITHUB_WORKSPACE:-$(pwd)}"
          JDK_OUT_DIR="${ROOT_DIR}/third_party/jdk-bin"

          normalize_tree_permissions() {
              local path="$1"

              [ -e "$path" ] || return 0

              # macOS-specific cleanup. Ignore errors on Linux or unsupported files.
              chmod -RN "$path" 2>/dev/null || true
              chflags -R nouchg "$path" 2>/dev/null || true
              xattr -cr "$path" 2>/dev/null || true

              # Make the tree readable/traversable by the signing step.
              chmod -R u+rwX,go+rX "$path"

              # Keep directories traversable and files readable.
              find "$path" -type d -exec chmod 755 {} +
              find "$path" -type f -exec chmod u+rw,go+r {} +
          }
          mkdir -p .jdk-runtime build

          gh release download ${JDK_RUNTIME_PREFIX}-${JDK_VERSION}-${JDK_RUNTIME_VERSION} \
            --pattern "muplar-jdk-runtime-macos-arm64-x86_64.tar.gz" \
            --dir .jdk-runtime \
            --clobber

          echo "[setup-jdk] Extracting..."
          tar -xzvf .jdk-runtime/muplar-jdk-runtime-macos-arm64-x86_64.tar.gz -C ${ROOT_DIR}

          echo "[setup-jdk] normalizing JDK permissions..."
          normalize_tree_permissions "${JDK_OUT_DIR}"
          if [ -f "$JDK_OUT_DIR/lib/server/classes.jsa" ]; then
              echo "[setup-jdk] classes.jsa permissions:"
              ls -lOe "$JDK_OUT_DIR/lib/server/classes.jsa"
          fi

          test -x ${JDK_OUT_DIR} || {
            echo "ERROR: prebuilt JDK runtime was not restored."
            exit 1
          }

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${GITHUB_WORKSPACE:-$(pwd)}"
          echo "Configuring source code..."
          SCRIPT=$ROOT_DIR/tools/configure-build.sh
          chmod +x ${SCRIPT}
          sh $SCRIPT

      - name: Build elfuse
        run: ninja -C build elfuse_external -v

      - name: Build Wawona
        run: ninja -C build wawona_external -v

      - name: Build Muplar app bundle
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${GITHUB_WORKSPACE:-$(pwd)}"

          cmake --build build

          test -d "${ROOT_DIR}/build/bin/Muplar Instance Manager.app" || {
            echo "ERROR: app bundle was not created:"
            echo "  ${ROOT_DIR}/build/bin/Muplar Instance Manager.app"
            exit 1
          }

          ls -la "${ROOT_DIR}/build/bin/Muplar Instance Manager.app/Contents"
          ls -la "${ROOT_DIR}/build/bin/Muplar Instance Manager.app/Contents/Frameworks"
          ls -la "${ROOT_DIR}/build/bin/Muplar Instance Manager.app/Contents/MacOS"

      - name: Package release zip
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          tools/package-release-macos.sh "$VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muplar-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos-arm64

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: Muplar-macos-arm64
          path: dist

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty"
            echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}"
            exit 1
          fi

          args=(
            --title "Muplar ${VERSION}"
            --notes "Automated Muplar macOS Apple Silicon build."
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--target "$GITHUB_SHA")
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists. Uploading assets with --clobber."
            gh release upload "$VERSION" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$VERSION" dist/*.zip dist/*.sha256 "${args[@]}"
          fi
