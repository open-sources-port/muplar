<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar Android roadmap overview</title>
<desc>A compact overview of Android execution progress with links to detailed roadmap files.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.current{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.current-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.current-subtitle{fill:#2563EB;font-size:12px}
.future{fill:#F9FAFB;stroke:#9CA3AF;stroke-width:1}
.future-title{fill:#4B5563;font-size:14px;font-weight:600}
.future-subtitle{fill:#6B7280;font-size:12px}
.phase-label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="24" width="600" height="72" rx="8"/>
<text class="done-title" x="60" y="50">Core guest execution</text>
<text class="done-subtitle" x="60" y="68">Static ELF, HVC loop, syscalls, JNI_OnLoad, RegisterNatives</text>
<text class="done-subtitle" x="60" y="84">Dynamic linker and Android runtime shim foundations</text>
<text class="done-title phase-label" x="560" y="58" text-anchor="middle">Phases 1-4</text>
</g>

<line class="arrow" x1="340" y1="96" x2="340" y2="124" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="128" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="154">NativeActivity runtime</text>
<text class="done-subtitle" x="60" y="172">Lifecycle, ANativeWindow, EGL/GLES, input queue, app loop, assets</text>
<text class="done-subtitle" x="60" y="190">APK launch envelope, package metadata, host-driven callbacks</text>
<text class="done-title phase-label" x="560" y="164" text-anchor="middle">5.1-5.13</text>
</g>

<line class="arrow" x1="340" y1="212" x2="340" y2="240" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="244" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="270">Binder and AIDL coverage</text>
<text class="done-subtitle" x="60" y="288">Service manager, local/remote Binder objects, Parcel payloads</text>
<text class="done-subtitle" x="60" y="306">Generated AIDL, lifecycle hardening, NDK C++ runtime dependencies</text>
<text class="done-title phase-label" x="560" y="280" text-anchor="middle">5.14-5.26</text>
</g>

<line class="arrow" x1="340" y1="328" x2="340" y2="356" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="360" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="386">Real APK native dependency closure</text>
<text class="done-subtitle" x="60" y="404">Load transitive DT_NEEDED libraries from extracted APK lib/arm64-v8a</text>
<text class="done-subtitle" x="60" y="422">Report missing libraries, unresolved imports, and strict-mode failures clearly</text>
<text class="done-title phase-label" x="560" y="396" text-anchor="middle">5.27 Done</text>
</g>

<line class="arrow" x1="340" y1="444" x2="340" y2="472" marker-end="url(#arrow)"/>

<g>
<rect class="future" x="40" y="476" width="600" height="84" rx="8"/>
<text class="future-title" x="60" y="502">Next Android execution frontier</text>
<text class="future-subtitle" x="60" y="520">Try less-controlled APKs, widen libc/libandroid coverage from real failures</text>
<text class="future-subtitle" x="60" y="538">Then move toward Java/ART surface and broader app compatibility</text>
<text class="future-title phase-label" x="560" y="512" text-anchor="middle">Future</text>
</g>

<g>
<rect class="future" x="40" y="600" width="600" height="72" rx="8"/>
<text class="future-title" x="60" y="626">Detailed roadmap files</text>
<text class="future-subtitle" x="60" y="644">docs/roadmap/android_phase5_runtime.svg</text>
<text class="future-subtitle" x="60" y="660">docs/roadmap/android_phase5_binder_aidl.svg</text>
<text class="future-subtitle" x="360" y="660">docs/roadmap/android_phase5_apk_dependency.svg</text>
</g>
</svg>
