<svg width="100%" viewBox="0 0 680 1500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar roadmap from current state to running Android apps</title>
<desc>A vertical flowchart showing 5 stages: current state, JNI_OnLoad, dynamic linker, Android runtime stubs, and full app execution.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.current{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.current-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.current-subtitle{fill:#2563EB;font-size:12px}
.future{fill:#F9FAFB;stroke:#9CA3AF;stroke-width:1}
.future-title{fill:#4B5563;font-size:14px;font-weight:600}
.future-subtitle{fill:#6B7280;font-size:12px}
.phase-label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
.callout{fill:#FFFBEB;stroke:#D97706;stroke-width:1;stroke-dasharray:4 3}
.callout-text{fill:#92400E;font-size:12px}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="20" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="44">✓ Static ELF + elfuse HVC loop</text>
<text class="done-subtitle" x="60" y="62">Guest boots, Linux syscalls translate, exit works</text>
<text class="done-title phase-label" x="560" y="50" text-anchor="middle">Phase 1 (Done)</text>
</g>

<line class="arrow" x1="340" y1="76" x2="340" y2="104" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="104" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="128">✓ JNI_OnLoad + RegisterNatives</text>
<text class="done-subtitle" x="60" y="146">.so boots, JNIEnv* live, native methods registered</text>
<text class="done-title phase-label" x="560" y="134" text-anchor="middle">Phase 2 (Done)</text>
</g>

<line class="arrow" x1="340" y1="160" x2="340" y2="188" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="188" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="212">✓ Dynamic linker (linker64)</text>
<text class="done-subtitle" x="60" y="230">Load libandroid.so, libc.so, resolve symbols + relocations</text>
<text class="done-title phase-label" x="560" y="220" text-anchor="middle">Phase 3 (Done)</text>
</g>

<line class="arrow" x1="340" y1="244" x2="340" y2="272" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="272" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="296">✓ Android runtime stubs (ART shim)</text>
<text class="done-subtitle" x="60" y="314">JNIEnv, JavaVM, liblog/libandroid/libdl/libc shim calls</text>
<text class="done-title phase-label" x="560" y="304" text-anchor="middle">Phase 4 (Done)</text>
</g>

<line class="arrow" x1="340" y1="328" x2="340" y2="356" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="356" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="380">✓ Direct Android JNI/native execution</text>
<text class="done-subtitle" x="60" y="398">Run JNI_OnLoad, resolve RegisterNatives, invoke native methods</text>
<text class="done-title phase-label" x="560" y="388" text-anchor="middle">Phase 5.1 (Done)</text>
</g>

<line class="arrow" x1="340" y1="412" x2="340" y2="440" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="440" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="464">✓ NativeActivity window + EGL smoke</text>
<text class="done-subtitle" x="60" y="482">Lifecycle callbacks, ANativeWindow, host window, EGL/GLES frame</text>
<text class="done-title phase-label" x="560" y="472" text-anchor="middle">Phase 5.2 (Done)</text>
</g>

<line class="arrow" x1="340" y1="496" x2="340" y2="524" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="524" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="548">✓ NativeActivity glue pthread + looper callbacks</text>
<text class="done-subtitle" x="60" y="566">Run pthread guest entrypoints; deliver ALooper addFd/poll callbacks</text>
<text class="done-title phase-label" x="560" y="556" text-anchor="middle">Phase 5.3 (Done)</text>
</g>

<line class="arrow" x1="340" y1="580" x2="340" y2="608" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="608" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="632">✓ Input queue + repeated app-loop scheduling</text>
<text class="done-subtitle" x="60" y="650">AInputQueue attach/detach, repeated poll, synthetic motion events</text>
<text class="done-title phase-label" x="560" y="640" text-anchor="middle">Phase 5.4 (Done)</text>
</g>

<line class="arrow" x1="340" y1="664" x2="340" y2="692" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="692" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="716">✓ Choreographer + frame-loop callbacks</text>
<text class="done-subtitle" x="60" y="734">Frame callbacks, reposted frames, app-loop drain budget</text>
<text class="done-title phase-label" x="560" y="724" text-anchor="middle">Phase 5.5 (Done)</text>
</g>

<line class="arrow" x1="340" y1="748" x2="340" y2="776" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="776" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="800">✓ Host input capture + queue rearm</text>
<text class="done-subtitle" x="60" y="818">Mouse/key events enqueue into AInputQueue; looper fd is rearmed</text>
<text class="done-title phase-label" x="560" y="808" text-anchor="middle">Phase 5.6 (Done)</text>
</g>

<line class="arrow" x1="340" y1="832" x2="340" y2="860" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="860" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="884">✓ Persistent host-driven app loop</text>
<text class="done-subtitle" x="60" y="902">Guest callbacks stay alive while host window pumps input/frame ticks</text>
<text class="done-title phase-label" x="560" y="892" text-anchor="middle">Phase 5.7 (Done)</text>
</g>

<line class="arrow" x1="340" y1="916" x2="340" y2="944" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="944" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="968">✓ Native app glue scheduler</text>
<text class="done-subtitle" x="60" y="986">Guest pthreads yield on blocking ALooper polls and resume on host/input ticks</text>
<text class="done-title phase-label" x="560" y="976" text-anchor="middle">Phase 5.8 (Done)</text>
</g>

<line class="arrow" x1="340" y1="1000" x2="340" y2="1016" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="1020" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="1044">✓ Native app glue command pipe</text>
<text class="done-subtitle" x="60" y="1062">Deliver APP_CMD_* lifecycle/window/input messages through guest pipe + ALooper</text>
<text class="done-subtitle" x="60" y="1080">libc pipe/read/write/close stubs wake persistent guest app threads</text>
<text class="done-title phase-label" x="560" y="1054" text-anchor="middle">Phase 5.9 (Done)</text>
</g>

<line class="arrow" x1="340" y1="1096" x2="340" y2="1112" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="1116" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="1140">✓ APK launch envelope</text>
<text class="done-subtitle" x="60" y="1158">Extract arm64-v8a native libraries and infer android.app.lib_name</text>
<text class="done-subtitle" x="60" y="1176">Run APK NativeActivity path through existing guest bootstrap</text>
<text class="done-title phase-label" x="560" y="1150" text-anchor="middle">Phase 5.10 (Done)</text>
</g>

<line class="arrow" x1="340" y1="1192" x2="340" y2="1208" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="1212" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="1236">✓ APK-local dependency loading</text>
<text class="done-subtitle" x="60" y="1254">Map APK-local DT_NEEDED libraries into guest memory</text>
<text class="done-subtitle" x="60" y="1272">Resolve direct .so relocations across selected lib + companion libs</text>
<text class="done-title phase-label" x="560" y="1246" text-anchor="middle">Phase 5.11 (Done)</text>
</g>

<line class="arrow" x1="340" y1="1288" x2="340" y2="1304" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="1308" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="1332">✓ APK assets + AssetManager</text>
<text class="done-subtitle" x="60" y="1350">Extract packaged assets and expose them through AAssetManager/AAsset stubs</text>
<text class="done-subtitle" x="60" y="1368">NativeActivity receives a live assetManager and can read APK asset bytes</text>
<text class="done-title phase-label" x="560" y="1342" text-anchor="middle">Phase 5.12 (Done)</text>
</g>

<line class="arrow" x1="340" y1="1384" x2="340" y2="1400" marker-end="url(#arrow)"/>

<g>
<rect class="current" x="40" y="1404" width="600" height="76" rx="8"/>
<text class="current-title" x="60" y="1428">→ Package metadata + app context</text>
<text class="current-subtitle" x="60" y="1446">Parse manifest package/config hints for runtime identity</text>
<text class="current-subtitle" x="60" y="1464">Prepare Context/Binder-facing data before service expansion</text>
<text class="current-title phase-label" x="560" y="1438" text-anchor="middle">Phase 5.13 (Current)</text>
</g>
</svg>
