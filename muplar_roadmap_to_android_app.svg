<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar roadmap from current state to running Android apps</title>
<desc>A vertical flowchart showing 5 stages: current state, JNI_OnLoad, dynamic linker, Android runtime stubs, and full app execution.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.current{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.current-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.current-subtitle{fill:#2563EB;font-size:12px}
.future{fill:#F9FAFB;stroke:#9CA3AF;stroke-width:1}
.future-title{fill:#4B5563;font-size:14px;font-weight:600}
.future-subtitle{fill:#6B7280;font-size:12px}
.phase-label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
.callout{fill:#FFFBEB;stroke:#D97706;stroke-width:1;stroke-dasharray:4 3}
.callout-text{fill:#92400E;font-size:12px}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="20" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="44">✓ Static ELF + elfuse HVC loop</text>
<text class="done-subtitle" x="60" y="62">Guest boots, Linux syscalls translate, exit works</text>
<text class="done-title phase-label" x="560" y="50" text-anchor="middle">Phase 1 (Done)</text>
</g>

<line class="arrow" x1="340" y1="76" x2="340" y2="104" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="104" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="128">✓ JNI_OnLoad + RegisterNatives</text>
<text class="done-subtitle" x="60" y="146">.so boots, JNIEnv* live, native methods registered</text>
<text class="done-title phase-label" x="560" y="134" text-anchor="middle">Phase 2 (Done)</text>
</g>

<line class="arrow" x1="340" y1="160" x2="340" y2="188" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="188" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="212">✓ Dynamic linker (linker64)</text>
<text class="done-subtitle" x="60" y="230">Load libandroid.so, libc.so, resolve symbols + relocations</text>
<text class="done-title phase-label" x="560" y="220" text-anchor="middle">Phase 3 (Done)</text>
</g>

<line class="arrow" x1="340" y1="244" x2="340" y2="272" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="272" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="296">✓ Android runtime stubs (ART shim)</text>
<text class="done-subtitle" x="60" y="314">JNIEnv, JavaVM, liblog/libandroid/libdl/libc shim calls</text>
<text class="done-title phase-label" x="560" y="304" text-anchor="middle">Phase 4 (Done)</text>
</g>

<line class="arrow" x1="340" y1="328" x2="340" y2="356" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="356" width="600" height="56" rx="8"/>
<text class="done-title" x="60" y="380">✓ Direct Android JNI/native execution</text>
<text class="done-subtitle" x="60" y="398">Run JNI_OnLoad, resolve RegisterNatives, invoke native methods</text>
<text class="done-title phase-label" x="560" y="388" text-anchor="middle">Phase 5.1 (Done)</text>
</g>

<line class="arrow" x1="340" y1="412" x2="340" y2="440" marker-end="url(#arrow)"/>

<g>
<rect class="current" x="40" y="440" width="600" height="56" rx="8"/>
<text class="current-title" x="60" y="464">→ NativeActivity bootstrap</text>
<text class="current-subtitle" x="60" y="482">Call ANativeActivity_onCreate with framework-shaped state</text>
<text class="current-title phase-label" x="560" y="472" text-anchor="middle">Phase 5.2 (Current)</text>
</g>

<g>
<rect class="callout" x="40" y="516" width="600" height="76" rx="8"/>
<text class="callout-text" x="340" y="540" text-anchor="middle">Next hard boundary:</text>
<text class="callout-text" x="340" y="558" text-anchor="middle">NativeActivity glue needs real guest pthread scheduling, looper events,</text>
<text class="callout-text" x="340" y="576" text-anchor="middle">window/input callbacks, then GPU/display and Binder compatibility.</text>
</g>
</svg>
