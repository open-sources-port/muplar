<svg width="100%" viewBox="0 0 680 536" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar Android Binder and AIDL roadmap</title>
<desc>Stable Binder, Parcel, and AIDL checklist summary.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.next{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.next-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.next-subtitle{fill:#2563EB;font-size:12px}
.label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="24" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="48">Binder object model</text>
<text class="done-subtitle" x="60" y="66">Service lookup, local/remote Binder handles, refcounts, weak refs, extensions</text>
<text class="done-subtitle" x="60" y="84">Death recipients, destroyed services, dead remote behavior</text>
<text class="done-title label" x="560" y="58" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="108" x2="340" y2="136" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="140" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="164">Parcel payload coverage</text>
<text class="done-subtitle" x="60" y="182">Primitive values, strings, arrays, nullable values, parcelables, FD payloads</text>
<text class="done-subtitle" x="60" y="200">Status headers preserve exceptions, service errors, and messages</text>
<text class="done-title label" x="560" y="174" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="224" x2="340" y2="252" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="256" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="280">AIDL generated code</text>
<text class="done-subtitle" x="60" y="298">Checked-in generated C++ sources and generated NDK AIDL fixture run</text>
<text class="done-subtitle" x="60" y="316">libc++ and NDK wrapper dependencies are covered by runtime stubs</text>
<text class="done-title label" x="560" y="290" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="340" x2="340" y2="368" marker-end="url(#arrow)"/>

<g>
<rect class="next" x="40" y="372" width="600" height="84" rx="8"/>
<text class="next-title" x="60" y="396">Next Binder/AIDL work</text>
<text class="next-subtitle" x="60" y="414">Let real APK scans identify missing Binder or generated-code behavior</text>
<text class="next-subtitle" x="60" y="432">Add focused fixtures for each real gap before broadening the model</text>
<text class="next-title label" x="560" y="406" text-anchor="middle">Next</text>
</g>

<text class="done-subtitle" x="60" y="508">Checklist: docs/roadmap/android/binder-aidl.md</text>
</svg>
