<svg width="100%" viewBox="0 0 680 644" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar Android APK dependency roadmap</title>
<desc>Stable APK dependency and compatibility-scanning checklist summary.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.next{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.next-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.next-subtitle{fill:#2563EB;font-size:12px}
.label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="24" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="48">APK native dependency loading</text>
<text class="done-subtitle" x="60" y="66">Extract arm64-v8a libs, select NativeActivity lib, map local DT_NEEDED deps</text>
<text class="done-subtitle" x="60" y="84">Resolve transitive APK-local dependency chains and direct relocations</text>
<text class="done-title label" x="560" y="58" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="108" x2="340" y2="136" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="140" width="600" height="96" rx="8"/>
<text class="done-title" x="60" y="164">Import diagnostics and strict mode</text>
<text class="done-subtitle" x="60" y="182">Missing required libraries fail early with the missing soname</text>
<text class="done-subtitle" x="60" y="200">Unresolved strong imports trap in exploratory mode or fail in strict mode</text>
<text class="done-subtitle" x="60" y="218">Generated NDK AIDL fixture passes strict native import scanning</text>
<text class="done-title label" x="560" y="174" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="236" x2="340" y2="264" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="268" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="292">Compatibility scan harness</text>
<text class="done-subtitle" x="60" y="310">Batch strict-mode APK scans create per-APK logs and status summaries</text>
<text class="done-subtitle" x="60" y="328">Markdown reports group missing libraries and unresolved imports as a backlog</text>
<text class="done-title label" x="560" y="302" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="352" x2="340" y2="380" marker-end="url(#arrow)"/>

<g>
<rect class="next" x="40" y="384" width="600" height="84" rx="8"/>
<text class="next-title" x="60" y="408">Next dependency work</text>
<text class="next-subtitle" x="60" y="426">Run real APK batches and promote repeated import gaps into focused runtime stubs</text>
<text class="next-subtitle" x="60" y="444">Keep intentionally unsupported imports visible in strict scan reports</text>
<text class="next-title label" x="560" y="418" text-anchor="middle">Next</text>
</g>

<text class="done-subtitle" x="60" y="536">Checklists:</text>
<text class="done-subtitle" x="60" y="554">docs/roadmap/android/apk-dependencies.md</text>
<text class="done-subtitle" x="60" y="572">docs/roadmap/android/compatibility-scanning.md</text>
</svg>
