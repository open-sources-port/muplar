<svg width="100%" viewBox="0 0 680 536" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar Android runtime roadmap</title>
<desc>Stable NativeActivity and APK runtime checklist summary.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.next{fill:#DBEAFE;stroke:#2563EB;stroke-width:1}
.next-title{fill:#1D4ED8;font-size:14px;font-weight:600}
.next-subtitle{fill:#2563EB;font-size:12px}
.label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="24" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="48">JNI and direct native execution</text>
<text class="done-subtitle" x="60" y="66">JNI_OnLoad, RegisterNatives, direct native method calls</text>
<text class="done-title label" x="560" y="58" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="100" x2="340" y2="128" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="132" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="156">NativeActivity runtime</text>
<text class="done-subtitle" x="60" y="174">Lifecycle callbacks, host window, ANativeWindow, EGL/GLES smoke path</text>
<text class="done-subtitle" x="60" y="192">Input queue, choreographer callbacks, app glue scheduler, command pipe</text>
<text class="done-title label" x="560" y="166" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="216" x2="340" y2="244" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="248" width="600" height="84" rx="8"/>
<text class="done-title" x="60" y="272">APK runtime envelope</text>
<text class="done-subtitle" x="60" y="290">APK native lib selection, asset extraction, AssetManager, package context</text>
<text class="done-subtitle" x="60" y="308">NativeActivity paths and lightweight Java context methods</text>
<text class="done-title label" x="560" y="282" text-anchor="middle">Done</text>
</g>

<line class="arrow" x1="340" y1="332" x2="340" y2="360" marker-end="url(#arrow)"/>

<g>
<rect class="next" x="40" y="364" width="600" height="84" rx="8"/>
<text class="next-title" x="60" y="388">Next runtime work</text>
<text class="next-subtitle" x="60" y="406">Run real host-window APKs and record first missing lifecycle/window/input APIs</text>
<text class="next-subtitle" x="60" y="424">Promote each real failure into a focused fixture before expanding behavior</text>
<text class="next-title label" x="560" y="398" text-anchor="middle">Next</text>
</g>

<text class="done-subtitle" x="60" y="500">Checklist: docs/roadmap/android/runtime.md</text>
</svg>
