<svg width="100%" viewBox="0 0 680 1160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Muplar Android Phase 5 runtime roadmap</title>
<desc>Detailed Phase 5.1 through 5.13 NativeActivity and APK runtime milestones.</desc>

<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.done{fill:#DCFCE7;stroke:#16A34A;stroke-width:1}
.done-title{fill:#166534;font-size:14px;font-weight:600}
.done-subtitle{fill:#15803D;font-size:12px}
.phase-label{font-size:12px;font-weight:600}
.arrow{stroke:#6B7280;stroke-width:1.5;fill:none}
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect class="done" x="40" y="20" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="44">Direct Android JNI/native execution</text>
<text class="done-subtitle" x="60" y="62">Run JNI_OnLoad, resolve RegisterNatives, invoke native methods</text>
<text class="done-title phase-label" x="560" y="54" text-anchor="middle">5.1 Done</text>
</g>
<line class="arrow" x1="340" y1="96" x2="340" y2="112" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="116" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="140">NativeActivity window + EGL smoke</text>
<text class="done-subtitle" x="60" y="158">Lifecycle callbacks, ANativeWindow, host window, EGL/GLES frame</text>
<text class="done-title phase-label" x="560" y="150" text-anchor="middle">5.2 Done</text>
</g>
<line class="arrow" x1="340" y1="192" x2="340" y2="208" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="212" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="236">NativeActivity glue pthread + looper callbacks</text>
<text class="done-subtitle" x="60" y="254">Run pthread guest entrypoints; deliver ALooper addFd/poll callbacks</text>
<text class="done-title phase-label" x="560" y="246" text-anchor="middle">5.3 Done</text>
</g>
<line class="arrow" x1="340" y1="288" x2="340" y2="304" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="308" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="332">Input queue + repeated app-loop scheduling</text>
<text class="done-subtitle" x="60" y="350">AInputQueue attach/detach, repeated poll, synthetic motion events</text>
<text class="done-title phase-label" x="560" y="342" text-anchor="middle">5.4 Done</text>
</g>
<line class="arrow" x1="340" y1="384" x2="340" y2="400" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="404" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="428">Choreographer + frame-loop callbacks</text>
<text class="done-subtitle" x="60" y="446">Frame callbacks, reposted frames, app-loop drain budget</text>
<text class="done-title phase-label" x="560" y="438" text-anchor="middle">5.5 Done</text>
</g>
<line class="arrow" x1="340" y1="480" x2="340" y2="496" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="500" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="524">Host input capture + queue rearm</text>
<text class="done-subtitle" x="60" y="542">Mouse/key events enqueue into AInputQueue; looper fd is rearmed</text>
<text class="done-title phase-label" x="560" y="534" text-anchor="middle">5.6 Done</text>
</g>
<line class="arrow" x1="340" y1="576" x2="340" y2="592" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="596" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="620">Persistent host-driven app loop</text>
<text class="done-subtitle" x="60" y="638">Guest callbacks stay alive while host window pumps input/frame ticks</text>
<text class="done-title phase-label" x="560" y="630" text-anchor="middle">5.7 Done</text>
</g>
<line class="arrow" x1="340" y1="672" x2="340" y2="688" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="692" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="716">Native app glue scheduler</text>
<text class="done-subtitle" x="60" y="734">Guest pthreads yield on blocking ALooper polls and resume on host/input ticks</text>
<text class="done-title phase-label" x="560" y="726" text-anchor="middle">5.8 Done</text>
</g>
<line class="arrow" x1="340" y1="768" x2="340" y2="784" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="788" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="812">Native app glue command pipe</text>
<text class="done-subtitle" x="60" y="830">Deliver APP_CMD_* through guest pipe + ALooper</text>
<text class="done-subtitle" x="60" y="848">libc pipe/read/write/close stubs wake persistent guest app threads</text>
<text class="done-title phase-label" x="560" y="822" text-anchor="middle">5.9 Done</text>
</g>
<line class="arrow" x1="340" y1="864" x2="340" y2="880" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="884" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="908">APK launch envelope</text>
<text class="done-subtitle" x="60" y="926">Extract arm64-v8a native libraries and infer android.app.lib_name</text>
<text class="done-subtitle" x="60" y="944">Run APK NativeActivity path through existing guest bootstrap</text>
<text class="done-title phase-label" x="560" y="918" text-anchor="middle">5.10 Done</text>
</g>
<line class="arrow" x1="340" y1="960" x2="340" y2="976" marker-end="url(#arrow)"/>

<g>
<rect class="done" x="40" y="980" width="600" height="76" rx="8"/>
<text class="done-title" x="60" y="1004">APK-local dependencies, assets, and context</text>
<text class="done-subtitle" x="60" y="1022">Map APK-local DT_NEEDED libraries; expose AAssetManager/AAsset</text>
<text class="done-subtitle" x="60" y="1040">Parse manifest package name and populate NativeActivity data paths</text>
<text class="done-title phase-label" x="560" y="1014" text-anchor="middle">5.11-5.13 Done</text>
</g>
</svg>
